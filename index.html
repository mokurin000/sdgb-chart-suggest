<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DX Rating Suggestion Viewer</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: rgba(0, 0, 0, 0.7);
        }

        header {
            padding: 10px 15px;
            background: rgba(0, 0, 0, 0.8);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .control-panel {
            display: flex;
            padding: 10px 15px;
            background: rgba(0, 0, 0, 0.6);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            align-items: center;
            gap: 15px;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
        }

        label {
            font-size: 0.9rem;
            white-space: nowrap;
        }

        input[type="range"] {
            flex: 1;
            height: 5px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            width: 18px;
            height: 18px;
            background: #fdbb2d;
            border-radius: 50%;
            cursor: pointer;
        }

        .rating-value {
            font-size: 1rem;
            font-weight: bold;
            min-width: 70px;
            text-align: center;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2rem;
            opacity: 0.8;
        }

        .table-container {
            flex: 1;
            overflow: auto;
            padding: 10px;
        }

        .styled-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 2px;
            font-size: 1.2rem;
            min-width: 800px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.15);
        }

        .bold-text {
            color: white;
            font-weight: bold;
            text-shadow: 0px 0px 5px #000;
        }

        .styled-table th {
            padding: 12px;
            background: rgba(0, 0, 0, 0.6);
            position: sticky;
            top: 0;
        }

        .styled-table td {
            padding: 8px;
            text-align: center;
        }

        .styled-table img {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
        }

        .music-info {
            line-height: 1.4;
        }

        .music-info small {
            display: block;
            font-size: 0.8em;
            opacity: 0.9;
        }

        footer {
            padding: 8px 15px;
            background: rgba(0, 0, 0, 0.8);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 0.8rem;
            opacity: 0.7;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>DX Rating Suggestion Viewer</h1>
            <p class="subtitle"><a style="color: #FFF;" href="./index.html?sortByDifficulty=0">Skip Difficulty</a> | <a
                    style="color: #FFF;" href="./index.html?sortByDifficulty=1">Sort Difficulty</a></p>
        </header>

        <div class="control-panel">
            <div class="slider-container">
                <label for="rating-slider">Rating:</label>
                <input type="range" id="rating-slider" min="10" max="164" value="150" step="1">
                <div class="rating-value" id="rating-display">15000</div>
            </div>
        </div>

        <div class="table-container" id="table-container">
            <div class="loading">Loading suggestions from data.json...</div>
        </div>

        <footer>
            <p>Total rating is rounded down to nearest 100. Data loaded from /data.json</p>
        </footer>
    </div>

    <script>
        const tableContainer = document.getElementById('table-container');
        const ratingSlider = document.getElementById('rating-slider');
        const ratingDisplay = document.getElementById('rating-display');

        let allSuggestions = null; // Will hold the loaded JSON
        let currentKey = ratingSlider.value * 100;
        ratingDisplay.textContent = ratingSlider.value * 2 + 2;

        let data_uri = "./data.json";

        let params = new URLSearchParams(document.location.search);
        let sort = params.get("sortByDifficulty");
        if (sort === "1") {
            data_uri = "./data_difficulty.json"
        }

        // Fetch data.json once on page load
        fetch(data_uri)
            .then(response => {
                if (!response.ok) throw new Error('Failed to load data');
                return response.json();
            })
            .then(data => {
                allSuggestions = data;
                renderTable(currentKey); // Initial render
            })
            .catch(err => {
                tableContainer.innerHTML = `<p style="text-align:center; color:#ff8888; padding:40px;">
                    Error loading data: ${err.message}<br>
                    Make sure data is in the same directory and accessible.
                </p>`;
            });

        function renderTable(ratingKey) {
            if (!allSuggestions) {
                tableContainer.innerHTML = '<div class="loading">Loading data...</div>';
                return;
            }

            const suggestion = allSuggestions[ratingKey];
            if (!suggestion || !suggestion.data || suggestion.data.length === 0) {
                tableContainer.innerHTML = `<p style="text-align:center; padding:40px;">
                    No suggestions available for rating ${ratingKey}.
                </p>`;
                return;
            }

            let rows = '';
            for (const item of suggestion.data) {
                const search_uri = `https://search.bilibili.com/all?keyword=maimai%20${encodeURIComponent(item.level)}%20AP%20${encodeURIComponent(item.music_title)}`;
                rows += `
                    <tr class="bold-text" style="background-color: ${item.color};">
                        <td>
                            <a href="${search_uri}" target="_blank" rel="noopener noreferrer">
                                <img loading="lazy" src="${item.cover_pic}" alt="${item.music_title}">
                            </a>
                        </td>
                        <td class="music-info">
                            <a href="${search_uri}" style="color: #FFF;" target="_blank" rel="noopener noreferrer">
                                ${item.music_title}
                            </a><br>
                            <small>${item.hint}</small>
                        </td>
                        <td>${item.difficulty}</td>
                        <td>${item.pass_rate}</td>
                        <td>${item.passed_players}</td>
                        <td>${item.nessacary}</td>
                    </tr>`;
            }

            const tableHTML = `
                <h2 style="text-align:center; padding:15px 0; margin-bottom:10px;">${suggestion.title || `${ratingKey} -> ${ratingKey + 100} 上分推荐`}</h2>
                <table class="styled-table">
                    <thead>
                        <tr>
                            <th>cover</th>
                            <th>music_title</th>
                            <th>difficulty</th>
                            <th>pass_rate</th>
                            <th>pass_count</th>
                            <th>nessacary</th>
                        </tr>
                    </thead>
                    <tbody>${rows}</tbody>
                </table>`;

            tableContainer.innerHTML = tableHTML;
        }

        // Slider handler
        ratingSlider.addEventListener('input', function () {
            ratingDisplay.textContent = this.value * 2 + 2;

            const baseRating = parseInt(this.value) * 100;
            currentKey = baseRating;
            renderTable(baseRating);
        });
    </script>
</body>

</html>
